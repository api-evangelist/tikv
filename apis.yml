aid: tikv
name: TiKV
description: >-
  TiKV is a CNCF-graduated distributed transactional key-value database built in Rust with Raft consensus. Originally
  created to complement TiDB, it provides horizontal scalability, strong consistency, and high availability with ACID
  transaction support. Client APIs are available for Java, Rust, Python, Go, and C++. An HTTP management API provides
  status, configuration, and monitoring endpoints.
